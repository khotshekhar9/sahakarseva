<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | SahakarSeva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3.2">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--background-color);
            padding: 2rem;
        }
        .error-card {
            text-align: center;
            max-width: 520px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary-color), #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.05em;
            animation: float 3s ease-in-out infinite;
        }
        .error-illustration {
            font-size: 5rem;
            margin: 1rem 0;
            animation: float 3s ease-in-out infinite;
            animation-delay: 0.5s;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }
        .error-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary-color), #0f2823);
            border: none;
            color: white;
            padding: 0.75rem 1.75rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3);
        }
        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(26, 115, 232, 0.4);
            color: white;
        }
        .btn-outline-custom {
            border: 1.5px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1.75rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            background: transparent;
        }
        .btn-outline-custom:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: rgba(26, 115, 232, 0.05);
        }
        .breadcrumb-trail {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(26, 115, 232, 0.1);
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.8rem;
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 1.5rem;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        @media (max-width: 576px) {
            .error-page { padding: 1rem; }
            .error-code { font-size: 4.2rem; }
            .error-illustration { font-size: 3rem; margin: 0.5rem 0; }
            .error-title { font-size: 1.2rem; }
            .error-subtitle { font-size: 0.82rem; margin-bottom: 1.25rem; }
            .btn-primary-custom, .btn-outline-custom { padding: 0.5rem 1.1rem; font-size: 0.82rem; }
        }
    </style>
</head>
<body>
<div class="error-page">
    <div class="error-card">
        <div class="breadcrumb-trail">
            🤝 SahakarSeva Cooperative Gig Platform
        </div>
        <div class="error-code">404</div>
        <div class="error-illustration">🔍</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-subtitle">
            The requested service or page could not be located.<br>
            The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="error-actions">
            <a href="javascript:history.back()" class="btn-outline-custom">
                ← Go Back
            </a>
            <a href="/" class="btn-primary-custom">
                🏠 Go to Dashboard
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Apply saved theme to error pages too
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') document.body.classList.add('dark-mode');
</script>
</body>
</html>
